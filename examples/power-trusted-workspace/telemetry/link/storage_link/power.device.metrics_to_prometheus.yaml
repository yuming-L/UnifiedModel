kind: storage_link
schema:
  url: "umodel.aliyun.com"
  version: "v1.0.0"
metadata:
  name: "power.device.metrics_to_prometheus"
  domain: power
  display_name:
    en_us: "Device metrics stored in Prometheus"
    zh_cn: "设备指标存储到 Prometheus"
spec:
  src:
    domain: power
    kind: metric_set
    name: power.device.metrics
  dest:
    domain: power
    kind: prometheus
    name: power.prometheus.core
  fields_mapping:
    target_id: target_id
    environment: environment

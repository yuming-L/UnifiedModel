kind: entity_set
schema:
  url: "umodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "power.device"
  domain: power
  display_name:
    en_us: "Power Device"
    zh_cn: "电力设备"
  description:
    en_us: "Field device with telemetry, alarms, and health status."
    zh_cn: "带实时遥测、告警和健康状态的现场设备。"
spec:
  fields:
    - name: id
      type: string
      display_name: { en_us: "ID", zh_cn: "ID" }
    - name: display_name
      type: string
      display_name: { en_us: "Name", zh_cn: "名称" }
    - name: status
      type: string
      display_name: { en_us: "Status", zh_cn: "状态" }
    - name: device_type
      type: string
      display_name: { en_us: "Device Type", zh_cn: "设备类型" }
    - name: health_score
      type: integer
      display_name: { en_us: "Health Score", zh_cn: "健康分" }
    - name: owner
      type: string
      display_name: { en_us: "Owner", zh_cn: "责任人" }
  primary_key_fields:
    - id
  id_generator: "id"
  name_fields:
    - display_name
  ordered_fields: ["id", "display_name", "status", "device_type", "health_score", "owner"]
  first_observed_time_field: "__first_observed_time__"
  last_observed_time_field: "__last_observed_time__"

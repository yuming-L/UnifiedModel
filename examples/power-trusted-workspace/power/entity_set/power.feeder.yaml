kind: entity_set
schema:
  url: "umodel.aliyun.com"
  version: "v0.1.0"
metadata:
  name: "power.feeder"
  domain: power
  display_name:
    en_us: "Power Feeder"
    zh_cn: "馈线"
  description:
    en_us: "Distribution feeder connecting the station to downstream transformers and devices."
    zh_cn: "连接变电站与下游变压器、设备的配电馈线。"
spec:
  fields:
    - name: id
      type: string
      display_name: { en_us: "ID", zh_cn: "ID" }
    - name: display_name
      type: string
      display_name: { en_us: "Name", zh_cn: "名称" }
    - name: status
      type: string
      display_name: { en_us: "Status", zh_cn: "状态" }
    - name: load_pct
      type: integer
      display_name: { en_us: "Load %", zh_cn: "负载%" }
    - name: owner
      type: string
      display_name: { en_us: "Owner", zh_cn: "责任人" }
  primary_key_fields:
    - id
  id_generator: "id"
  name_fields:
    - display_name
  ordered_fields: ["id", "display_name", "status", "load_pct", "owner"]
  first_observed_time_field: "__first_observed_time__"
  last_observed_time_field: "__last_observed_time__"
